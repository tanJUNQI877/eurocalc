<style>
:root{
  --bg:#f3f5f9;--card:#ffffff;--ink:#0b1b33;--muted:#5a6b85;--line:#e2e7f0;--soft:#eef2f9;
  --accent:#1f5eff;--accent-ink:#ffffff;--band:#0b1b33;--band-ink:#ffffff;--band-soft:rgba(255,255,255,.1);
  --c1:#2b62e8;--c2:#0f9d8a;--c3:#e0a21b;--c4:#e0594f;--c5:#8a98b0;
  --shadow:0 1px 2px rgba(11,27,51,.05),0 8px 24px rgba(11,27,51,.05);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0a111e;--card:#121a2b;--ink:#e8edf7;--muted:#9aa8c2;--line:#222d44;--soft:#182238;
    --accent:#6f9bff;--accent-ink:#0a111e;--band:#0d1628;--c1:#6f9bff;--c2:#37c3ae;--c3:#f0bb48;--c4:#f07f76;--c5:#7d8ca8;
    --shadow:none;color-scheme:dark}
}
html.force-light{
  --bg:#ffffff;--card:#ffffff;--ink:#0b1b33;--muted:#5a6b85;--line:#e2e7f0;--soft:#eef2f9;
  --accent:#1f5eff;--accent-ink:#ffffff;--c1:#2b62e8;--c2:#0f9d8a;--c3:#e0a21b;--c4:#e0594f;--c5:#8a98b0;--shadow:none;color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.5;font-size:16px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header band */
.band{background:var(--band);color:var(--band-ink)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:14px}
.brand{font-weight:800;font-size:1.2rem;letter-spacing:-.02em}
.brand i{font-style:normal;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:#fff;color:#0b1b33;margin-right:8px;font-size:.95rem}
.lang{width:auto;background:var(--band-soft);color:var(--band-ink);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:7px 10px}
.lang option{color:#0b1b33}
.hero{padding-top:18px;padding-bottom:20px}
h1{font-size:clamp(1.55rem,4.2vw,2.3rem);line-height:1.15;margin:0 0 8px;letter-spacing:-.025em;text-wrap:balance}
.sub{margin:0;color:rgba(255,255,255,.75);max-width:62ch}
.live{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;align-items:center}
.chip{background:var(--band-soft);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:7px 12px;font-size:.84rem;line-height:1.25}
.chip b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums}
.chip span{opacity:.72}
.livemeta{font-size:.78rem;opacity:.7;margin-top:8px}
.livemeta.off{opacity:1;color:#ffd58a}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.92rem;white-space:nowrap}
.tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* layout */
.app{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;margin:16px 0 8px;align-items:start}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.inputs{position:sticky;top:12px}
@media (max-width:900px){.inputs{position:static}}
.card h2{margin:0 0 2px;font-size:1.1rem;letter-spacing:-.01em}
.desc{color:var(--muted);margin:0 0 16px;font-size:.9rem}
.fields{display:grid;gap:14px}
label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:5px}
input,select{width:100%;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-variant-numeric:tabular-nums}
.hint{font-size:.78rem;color:var(--muted);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:.78rem;font-weight:600;text-decoration:underline}
.btn{margin-top:16px;width:100%;background:var(--ink);color:var(--card);border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer}
.btn:hover{opacity:.9}
.pdfhint{font-size:.76rem;color:var(--muted);margin:6px 0 0}
.note{font-size:.8rem;color:var(--muted);margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line)}

.results{display:grid;gap:16px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.kpis{grid-template-columns:minmax(0,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:.8rem;color:var(--muted);font-weight:600}
.kpi .v{font-size:clamp(1.25rem,2.6vw,1.7rem);font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi.main{background:var(--accent);border-color:var(--accent)}
.kpi.main .l,.kpi.main .v{color:var(--accent-ink)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.charts .wide{grid-column:1/-1}
.charts.r12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
@media (max-width:820px){.charts.r12{grid-template-columns:minmax(0,1fr)}}
.card h3{margin:0 0 10px;font-size:.92rem;color:var(--muted);font-weight:700}
.chartbox{position:relative;height:270px}
.details .row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.details .row:last-child{border-bottom:0}
.details b{font-variant-numeric:tabular-nums;text-align:right}

section.about{margin:28px 0;font-size:.92rem;color:var(--muted);max-width:75ch}
section.about h3{color:var(--ink);margin:0 0 6px;font-size:1rem}
footer{border-top:1px solid var(--line);padding-top:20px;padding-bottom:40px;font-size:.84rem;color:var(--muted)}
footer a,.plink{color:var(--accent);cursor:pointer;text-decoration:underline;background:none;border:0;padding:0;font-size:inherit}
dialog{max-width:620px;width:calc(100% - 32px);border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:22px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin-top:0}
.print-only{display:none}

@media print{
  .noprint,.band,.tabs,.inputs,footer .plink{display:none!important}
  .print-only{display:block}
  body{background:#fff}
  .app{display:block;margin:0}
  .results{gap:12px}
  .card,.kpi{box-shadow:none;break-inside:avoid}
  .charts{grid-template-columns:1fr 1fr}
  .chartbox{height:220px}
  .kpi.main{background:#fff;border:2px solid #1f5eff}
  .kpi.main .l,.kpi.main .v{color:#0b1b33}
  .ptable{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:.92rem}
  .ptable td{padding:5px 0;border-bottom:1px solid #ddd}
  .ptable td:last-child{text-align:right;font-weight:600}
}
</style>
</head>

<div class="band noprint">
  <div class="wrap">
    <div class="top">
      <div class="brand"><i>€</i>EuroCalc</div>

  </div>
</div>

<main class="wrap">
  <nav class="tabs noprint" id="tabs" role="tablist"></nav>
  <div class="print-only" id="printHead"></div>
  <div class="app">
    <div class="card inputs" id="inputs"></div>

      <div class="kpis" id="kpis"></div>
      <div class="card details" id="details" hidden></div>

</main>

<footer><div class="wrap">
  <div id="disc"></div>
  <p><button class="plink" id="privLink"></button></p>
  <p>© <span id="yr"></span> EuroCalc</p>
</div></footer>

<dialog id="priv"><h2 id="privT"></h2><div id="privP"></div>
  <button class="btn" id="privClose"></button></dialog>

const LOCALE={en:"en-IE",de:"de-DE",fr:"fr-FR",es:"es-ES"};
const EURO=["AT","BE","BG","HR","CY","EE","FI","FR","DE","GR","IE","IT","LV","LT","LU","MT","NL","PT","SK","SI","ES"];

/* Built-in defaults, used when rates.json cannot be loaded */
const FALLBACK={updated:"2026-11-04",deposit:{value:2.5,period:"2026-10-29"},inflation_ea:{value:3.8,period:"2026-09"},
 mortgage_ea:{value:3.6,period:"2026-08"},inflation_country:{},vat_checked:"2026-11-04",
 vat:{AT:20,BE:21,BG:20,HR:25,CY:19,CZ:21,DK:25,EE:24,FI:25.5,FR:20,DE:19,GR:24,HU:27,IE:23,IT:22,LV:21,LT:21,LU:17,MT:18,NL:21,PL:23,PT:23,RO:21,SK:23,SI:22,ES:21,SE:25}};

let lang="en",tool="vat",RATES=FALLBACK,LIVE=false,last=null,charts={},forceLight=false;
const $=id=>document.getElementById(id);
const T=()=>I18N[lang];

/* ============ formatting ============ */
const eur=n=>new Intl.NumberFormat(LOCALE[lang],{style:"currency",currency:"EUR"}).format(n);
const eurC=n=>new Intl.NumberFormat(LOCALE[lang],{style:"currency",currency:"EUR",notation:"compact",maximumFractionDigits:1}).format(n);
const pct=n=>new Intl.NumberFormat(LOCALE[lang],{maximumFractionDigits:2}).format(n)+" %";
const num=id=>{const el=$(id);if(!el)return 0;const v=parseFloat(String(el.value).replace(",","."));return isFinite(v)?v:0};
function fmtPeriod(p){
  if(!p)return"";
  const m=/^(\d{4})-(\d{2})(?:-(\d{2}))?$/.exec(p);if(!m)return p;
  const d=new Date(Date.UTC(+m[1],+m[2]-1,m[3]?+m[3]:1));
  return new Intl.DateTimeFormat(LOCALE[lang],m[3]?{year:"numeric",month:"short",day:"numeric",timeZone:"UTC"}:{year:"numeric",month:"short",timeZone:"UTC"}).format(d);
}
const CN={};
function countryName(code){
  if(code==="EA")return T().ea;
  if(!CN[lang]){CN[lang]={};try{const dn=new Intl.DisplayNames([LOCALE[lang]],{type:"region"});
    Object.keys(RATES.vat).forEach(c=>CN[lang][c]=dn.of(c))}catch(e){}}
  return CN[lang][code]||code;
}
const tpl=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]);

/* ============ rates ============ */
function loadRates(){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),3000);
  return fetch("rates.json",{cache:"no-cache",signal:ctl.signal})
    .then(r=>r.ok?r.json():Promise.reject())
    .then(j=>{RATES=Object.assign({},FALLBACK,j);RATES.vat=Object.assign({},FALLBACK.vat,j.vat||{});LIVE=true})
    .catch(()=>{LIVE=false})
    .finally(()=>clearTimeout(to));
}
function renderLive(){
  const t=T(),L=t.live,box=$("live");box.innerHTML="";
  const items=[["deposit",L.depo],["inflation_ea",L.infl],["mortgage_ea",L.mort]];
  items.forEach(([k,label])=>{const r=RATES[k];if(!r||typeof r.value!=="number")return;
    const d=document.createElement("div");d.className="chip";
    d.innerHTML=`<span>${label}</span><b>${pct(r.value)}</b><span>${fmtPeriod(r.period)}</span>`;box.appendChild(d)});
  const m=$("livemeta");
  if(LIVE){m.className="livemeta";m.textContent=`${L.upd} ${fmtPeriod(RATES.updated)} · ${L.src} · ${L.vat} ${fmtPeriod(RATES.vat_checked)}`}
  else{m.className="livemeta off";m.textContent=L.off}
}

/* ============ static render ============ */
function renderStatic(){
  const t=T();document.documentElement.lang=lang;
  $("h1").textContent=t.h1;$("sub").textContent=t.sub;
  $("infoT").textContent=t.infoT;$("infoP").textContent=t.infoP;
  $("disc").textContent=t.disc;$("privLink").textContent=t.privLink;
  $("privT").textContent=t.privT;$("privP").innerHTML=t.privP;$("privClose").textContent=t.close;
  $("yr").textContent=new Date().getFullYear();
  document.title=t.tabs[tool]+" – EuroCalc";
  const tabs=$("tabs");tabs.innerHTML="";
  Object.keys(t.tabs).forEach(k=>{
    const b=document.createElement("button");b.className="tab";b.setAttribute("role","tab");
    b.setAttribute("aria-selected",String(k===tool));b.textContent=t.tabs[k];
    b.onclick=()=>{tool=k;location.hash=k;renderStatic();renderTool()};tabs.appendChild(b);
  });
  renderLive();
}

/* ============ inputs ============ */
const field=(id,label,val,step,hint)=>`<div><label for="${id}">${label}</label><input id="${id}" type="number" inputmode="decimal" step="${step||"any"}" value="${val}">${hint?`<div class="hint" id="${id}Hint"></div>`:""}</div>`;
const CHARTS={vat:[["c1",0],["c2",0]],free:[["c1",0],["c2",0]],infl:[["c1",1]],mort:[["c1",0],["c2",0]],dca:[["c1",0],["c2",0]]};

function sortedCountries(codes){return codes.slice().sort((a,b)=>countryName(a).localeCompare(countryName(b),LOCALE[lang]))}

function renderTool(){
  const t=T(),s=t[tool],vatR=RATES.vat;
  let h=`<h2>${s.t}</h2><p class="desc">${s.d}</p><div class="fields">`;
  if(tool==="vat"){
    const opts=sortedCountries(Object.keys(vatR)).map(c=>`<option value="${c}" ${c==="DE"?"selected":""}>${countryName(c)} (${vatR[c]}%)</option>`).join("");
    h+=`<div><label for="country">${s.country}</label><select id="country">${opts}</select></div>
        <div><label for="mode">${s.mode}</label><select id="mode"><option value="1">${s.m1}</option><option value="2">${s.m2}</option></select></div>`
      +field("amount",s.amount,1000)+field("rate",s.rate,vatR.DE,"0.1");
  }else if(tool==="free"){
    h+=field("income",s.income,60000)+field("exp",s.exp,8000)+field("soc",s.soc,20,"0.1")+field("tax",s.tax,22,"0.1");
  }else if(tool==="infl"){
    const ic=RATES.inflation_country||{};
    const opts=`<option value="EA">${t.ea}</option>`+sortedCountries(EURO).map(c=>`<option value="${c}">${countryName(c)}${ic[c]?` (${ic[c].value}%)`:""}</option>`).join("");
    const start=RATES.inflation_ea&&typeof RATES.inflation_ea.value==="number"?RATES.inflation_ea.value:2.5;
    h+=`<div><label for="country">${s.country}</label><select id="country">${opts}</select></div>`
      +field("amount",s.amount,10000)+field("years",s.years,10,"1")+field("rate",s.rate,start,"0.1",true);
  }else if(tool==="mort"){
    const r=RATES.mortgage_ea,start=r&&typeof r.value==="number"?r.value:3.5;
    h+=field("amount",s.amount,250000)+field("rate",s.rate,start,"0.01",true)+field("years",s.years,25,"1");
  }else{
    h+=field("pmt",s.pmt,300)+field("years",s.years,20,"1")+field("rate",s.rate,6,"0.1");
  }
  h+=`</div><button class="btn" id="pdfBtn">${t.pdf}</button><p class="pdfhint">${t.pdfHint}</p><p class="note">${s.note}</p>`;
  $("inputs").innerHTML=h;
  $("charts").className="charts"+(tool==="vat"||tool==="free"?" r12":"");
  $("charts").innerHTML=CHARTS[tool].map(([id,wide])=>`<div class="card ${wide?"wide":""}"><h3 id="${id}T"></h3><div class="chartbox"><canvas id="${id}" role="img"></canvas></div></div>`).join("");
  Object.keys(charts).forEach(k=>{charts[k].destroy();delete charts[k]});

  $("inputs").querySelectorAll("input,select").forEach(el=>el.addEventListener("input",e=>{
    if(tool==="vat"&&e.target.id==="country")$("rate").value=RATES.vat[e.target.value];
    if(tool==="infl"&&e.target.id==="country"){const v=e.target.value==="EA"?RATES.inflation_ea:(RATES.inflation_country||{})[e.target.value];
      if(v&&typeof v.value==="number")$("rate").value=v.value}
    if(tool==="infl"&&e.target.id==="country")setHint();
    compute();
  }));
  $("pdfBtn").onclick=()=>window.print();
  setHint();compute();
}

function setHint(){
  const t=T(),h=$("rateHint");if(!h)return;
  let v=null,msg="";
  if(tool==="mort"){v=RATES.mortgage_ea;if(v&&typeof v.value==="number")msg=tpl(t.hMort,{v:v.value,p:fmtPeriod(v.period)})}
  if(tool==="infl"){const c=$("country").value;v=c==="EA"?RATES.inflation_ea:(RATES.inflation_country||{})[c];
    msg=v&&typeof v.value==="number"?tpl(t.hInfl,{v:v.value,p:fmtPeriod(v.period)}):t.hNone}
  h.innerHTML="";
  if(!msg)return;
  const sp=document.createElement("span");sp.textContent=msg;h.appendChild(sp);
  if(v&&typeof v.value==="number"){const b=document.createElement("button");b.type="button";b.className="link";b.textContent=t.useLatest;
    b.onclick=()=>{$("rate").value=v.value;compute()};h.appendChild(b)}
}

/* ============ charts ============ */
function palette(){const cs=getComputedStyle(document.documentElement),g=n=>cs.getPropertyValue(n).trim();
  return{c1:g("--c1"),c2:g("--c2"),c3:g("--c3"),c4:g("--c4"),c5:g("--c5"),muted:g("--muted"),line:g("--line"),card:g("--card"),ink:g("--ink")}}
const centerText={id:"centerText",afterDraw(ch,_a,o){if(!o||!o.text)return;const a=ch.chartArea,x=(a.left+a.right)/2,y=(a.top+a.bottom)/2,c=ch.ctx;
  c.save();c.textAlign="center";c.textBaseline="middle";c.fillStyle=o.color;c.font="800 24px system-ui,sans-serif";c.fillText(o.text,x,y-8);
  c.fillStyle=o.sub;c.font="600 12px system-ui,sans-serif";c.fillText(o.label||"",x,y+14);c.restore()}};
if(window.Chart)Chart.register(centerText);

function mk(id,title,cfg){
  const el=$(id);if(!el||!window.Chart)return;
  $(id+"T").textContent=title;
  if(charts[id])charts[id].destroy();
  cfg.options=Object.assign({responsive:true,maintainAspectRatio:false,animation:false},cfg.options||{});
  Chart.defaults.font.family=getComputedStyle(document.body).fontFamily;
  charts[id]=new Chart(el,cfg);
}
const legend=p=>({position:"bottom",labels:{color:p.muted,usePointStyle:true,pointStyle:"rectRounded",boxWidth:10,padding:14}});
const axes=(p,o={})=>({x:{stacked:!!o.stacked,grid:{display:false},border:{color:p.line},ticks:{color:p.muted,maxTicksLimit:o.xMax||12},title:o.xTitle?{display:true,text:o.xTitle,color:p.muted}:{display:false}},
  y:{stacked:!!o.stacked,beginAtZero:true,grid:{color:p.line},border:{display:false},ticks:{color:p.muted,callback:v=>eurC(v)}}});
const tipEur={callbacks:{label:c=>` ${c.dataset.label||c.label}: ${eur(c.parsed.y!==undefined&&c.chart.config.type!=="doughnut"?c.parsed.y:c.parsed)}`}};
function doughnut(id,title,labels,data,colors,center,p){
  mk(id,title,{type:"doughnut",data:{labels,datasets:[{data,backgroundColor:colors,borderColor:p.card,borderWidth:3}]},
    options:{cutout:"68%",plugins:{legend:legend(p),tooltip:{callbacks:{label:c=>` ${c.label}: ${eur(c.parsed)}`}},centerText:{text:center[0],label:center[1],color:p.ink,sub:p.muted}}}});
}

/* ============ compute ============ */
function compute(){
  const t=T(),s=t[tool],p=palette();let inputs=[],kpis=[],details=null;
  if(tool==="vat"){
    const amt=Math.max(0,num("amount")),r=Math.max(0,num("rate")),mode=$("mode").value,cc=$("country").value;
    let net,vat,gross;if(mode==="1"){net=amt;vat=net*r/100;gross=net+vat}else{gross=amt;net=gross/(1+r/100);vat=gross-net}
    inputs=[[s.country,countryName(cc)],[s.mode,mode==="1"?s.m1:s.m2],[s.amount,eur(amt)],[s.rate,pct(r)]];
    kpis=[[s.gross,eur(gross),1],[s.net,eur(net)],[s.vat,eur(vat)]];
    doughnut("c1",s.ch1,[s.lNet,s.lVat],[net,vat],[p.c1,p.c3],[gross>0?pct(vat/gross*100):"–",s.lVat],p);
    const codes=Object.keys(RATES.vat).sort((a,b)=>RATES.vat[b]-RATES.vat[a]||a.localeCompare(b));
    mk("c2",s.ch2,{type:"bar",data:{labels:codes,datasets:[{data:codes.map(c=>RATES.vat[c]),backgroundColor:codes.map(c=>c===cc?p.c1:p.c5+"99"),borderRadius:3}]},
      options:{scales:{x:{grid:{display:false},border:{color:p.line},ticks:{color:p.muted,autoSkip:false,maxRotation:90,minRotation:90,font:{size:10}}},
        y:{beginAtZero:true,grid:{color:p.line},border:{display:false},ticks:{color:p.muted,callback:v=>v+"%"}}},
        plugins:{legend:{display:false},tooltip:{callbacks:{title:c=>countryName(c[0].label),label:c=>` ${c.parsed.y}%`}}}}});
  }else if(tool==="free"){
    const inc=Math.max(0,num("income")),ex=Math.max(0,num("exp")),so=Math.max(0,num("soc")),tx=Math.max(0,num("tax"));
    const calc=r=>{const profit=Math.max(0,r-ex),soc=profit*so/100,taxA=Math.max(0,profit-soc)*tx/100;return{profit,soc,taxA,net:profit-soc-taxA}};
    const c=calc(inc),burden=inc>0?(1-c.net/inc)*100:0;
    inputs=[[s.income,eur(inc)],[s.exp,eur(ex)],[s.soc,pct(so)],[s.tax,pct(tx)]];
    kpis=[[s.netY,eur(c.net),1],[s.netM,eur(c.net/12)],[s.eff,pct(burden)]];
    details=[[s.profit,eur(c.profit)],[s.socAmt,eur(c.soc)],[s.taxAmt,eur(c.taxA)]];
    doughnut("c1",s.ch1,[s.lExp,s.lSoc,s.lTax,s.lNet],[Math.min(ex,inc),c.soc,c.taxA,c.net],[p.c5,p.c3,p.c4,p.c2],[inc>0?pct(c.net/inc*100):"–",s.lNet],p);
    const fs=[0.5,0.6,0.7,0.8,0.9,1,1.1,1.2,1.3,1.4,1.5];
    mk("c2",s.ch2,{type:"line",data:{labels:fs.map(f=>(f>=1?"+":"")+Math.round((f-1)*100)+"%"),datasets:[{label:s.lNet,data:fs.map(f=>calc(inc*f).net),borderColor:p.c2,backgroundColor:p.c2+"22",fill:true,tension:.25,
      pointRadius:fs.map(f=>f===1?6:2),pointBackgroundColor:p.c2}]},
      options:{scales:axes(p,{xTitle:s.lRev}),plugins:{legend:{display:false},tooltip:tipEur}}});
  }else if(tool==="infl"){
    const a=Math.max(0,num("amount")),y=Math.min(60,Math.max(0,Math.round(num("years")))),r=num("rate"),f=Math.pow(1+r/100,y);
    inputs=[[s.country,countryName($("country").value)],[s.amount,eur(a)],[s.years,String(y)],[s.rate,pct(r)]];
    kpis=[[s.real,eur(a/f),1],[s.need,eur(a*f)],[s.loss,pct(a>0?(1-1/f)*100:0)]];
    const ys=Array.from({length:y+1},(_,i)=>i);
    mk("c1",s.ch1,{type:"line",data:{labels:ys,datasets:[
      {label:s.lNeed,data:ys.map(i=>a*Math.pow(1+r/100,i)),borderColor:p.c3,backgroundColor:p.c3+"22",tension:.25,pointRadius:0},
      {label:s.lNom,data:ys.map(()=>a),borderColor:p.c5,borderDash:[6,5],pointRadius:0},
      {label:s.lPow,data:ys.map(i=>a/Math.pow(1+r/100,i)),borderColor:p.c1,backgroundColor:p.c1+"22",fill:"origin",tension:.25,pointRadius:0}]},
      options:{scales:axes(p,{xTitle:t.yr}),plugins:{legend:legend(p),tooltip:Object.assign({mode:"index",intersect:false},tipEur)},interaction:{mode:"index",intersect:false}}});
  }else if(tool==="mort"){
    const P=Math.max(0,num("amount")),R=Math.max(0,num("rate")),Y=Math.min(50,Math.max(0,num("years"))),n=Math.round(Y*12),i=R/1200;
    let m=0;if(n>0)m=i===0?P/n:P*i/(1-Math.pow(1+i,-n));
    const tot=m*n,intT=Math.max(0,tot-P);
    inputs=[[s.amount,eur(P)],[s.rate,pct(R)],[s.years,String(Y)]];
    kpis=[[s.pay,eur(m),1],[s.total,eur(tot)],[s.int,eur(intT)]];
    doughnut("c1",s.ch1,[s.lPrin,s.lInt],[P,intT],[p.c1,p.c3],[tot>0?pct(intT/tot*100):"–",s.lInt],p);
    let bal=P,cum=0;const lab=[0],bS=[P],cS=[0];
    for(let k=1;k<=n;k++){const it=bal*i;cum+=it;bal-=(m-it);if(k%12===0||k===n){lab.push(k%12===0?k/12:+(k/12).toFixed(1));bS.push(Math.max(0,bal));cS.push(cum)}}
    mk("c2",s.ch2,{type:"line",data:{labels:lab,datasets:[
      {label:s.lBal,data:bS,borderColor:p.c1,backgroundColor:p.c1+"22",fill:true,tension:.2,pointRadius:0},
      {label:s.lCum,data:cS,borderColor:p.c3,tension:.2,pointRadius:0}]},
      options:{scales:axes(p,{xTitle:t.yr}),plugins:{legend:legend(p),tooltip:Object.assign({mode:"index",intersect:false},tipEur)},interaction:{mode:"index",intersect:false}}});
  }else{
    const pm=Math.max(0,num("pmt")),Y=Math.min(60,Math.max(0,Math.round(num("years")))),R=num("rate");
    const fv=(rate,months)=>{const im=Math.pow(1+rate/100,1/12)-1;return months===0?0:(Math.abs(im)<1e-12?pm*months:pm*(Math.pow(1+im,months)-1)/im)};
    const F=fv(R,Y*12),inv=pm*Y*12;
    inputs=[[s.pmt,eur(pm)],[s.years,String(Y)],[s.rate,pct(R)]];
    kpis=[[s.final,eur(F),1],[s.invested,eur(inv)],[s.gain,eur(F-inv)]];
    const ys=Array.from({length:Y},(_,k)=>k+1),y0=[0].concat(ys);
    mk("c1",s.ch1,{type:"bar",data:{labels:ys,datasets:[
      {label:s.lInv,data:ys.map(k=>pm*12*k),backgroundColor:p.c1,stack:"a"},
      {label:s.lGro,data:ys.map(k=>Math.max(0,fv(R,k*12)-pm*12*k)),backgroundColor:p.c2,stack:"a"}]},
      options:{scales:axes(p,{stacked:true,xTitle:t.yr}),plugins:{legend:legend(p),tooltip:Object.assign({mode:"index",intersect:false},tipEur)}}});
    mk("c2",s.ch2,{type:"line",data:{labels:y0,datasets:[
      {label:`${s.lHigh} (${pct(R+2)})`,data:y0.map(k=>fv(R+2,k*12)),borderColor:p.c2,pointRadius:0,tension:.2},
      {label:`${s.lBase} (${pct(R)})`,data:y0.map(k=>fv(R,k*12)),borderColor:p.c1,borderWidth:3,pointRadius:0,tension:.2},
      {label:`${s.lLow} (${pct(R-2)})`,data:y0.map(k=>fv(R-2,k*12)),borderColor:p.c4,pointRadius:0,tension:.2}]},
      options:{scales:axes(p,{xTitle:t.yr}),plugins:{legend:legend(p),tooltip:Object.assign({mode:"index",intersect:false},tipEur)},interaction:{mode:"index",intersect:false}}});
  }
  last={title:s.t,inputs,kpis,details};
  $("kpis").innerHTML=kpis.map(k=>`<div class="kpi ${k[2]?"main":""}"><div class="l">${k[0]}</div><div class="v">${k[1]}</div></div>`).join("");
  const d=$("details");
  if(details){d.hidden=false;d.innerHTML=`<h3>${t.detailsT}</h3>`+details.map(r=>`<div class="row"><span>${r[0]}</span><b>${r[1]}</b></div>`).join("")}else d.hidden=true;
  $("printHead").innerHTML=`<h1 style="color:#0b1b33;font-size:1.5rem;margin:0">EuroCalc – ${t.report}</h1><p style="color:#5a6b85;margin:2px 0 10px">${t.gen} ${new Intl.DateTimeFormat(LOCALE[lang],{dateStyle:"long"}).format(new Date())}</p>
    <h2 style="font-size:1.1rem;margin:0">${s.t}</h2><table class="ptable">${inputs.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</table>`;
}

/* print: always draw charts with the light palette */
window.addEventListener("beforeprint",()=>{forceLight=true;document.documentElement.classList.add("force-light");if($("charts").children.length)compute()});
window.addEventListener("afterprint",()=>{forceLight=false;document.documentElement.classList.remove("force-light");if($("charts").children.length)compute()});
if(window.matchMedia)matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(last)compute()});

/* ============ init ============ */
(function(){
  const nl=(navigator.language||"en").slice(0,2);if(I18N[nl])lang=nl;
  const h0=location.hash.slice(1);if(I18N.en.tabs[h0])tool=h0;
  $("lang").value=lang;
  $("lang").onchange=e=>{lang=e.target.value;renderStatic();renderTool()};
  $("privLink").onclick=()=>$("priv").showModal();
  $("privClose").onclick=()=>$("priv").close();
  window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(I18N.en.tabs[h]&&h!==tool){tool=h;renderStatic();renderTool()}});
  loadRates().finally(()=>{renderStatic();renderTool()});
})();
</script>
